%YAML 1.1
---
# Minimal Suricata 7 configuration for the lab "rules next to ML" sidecar (roadmap step 8).
# It writes ONE output: alert events (with the engine events Suricata raises as alerts, which the
# sensor's rule forwarder filters) as JSON lines in /eve/eve.json. No flow, http, dns,
# tls, anomaly or stats events, no fast.log, no stats.log, no packet payloads.
#
# HOME_NET and EXTERNAL_NET are set on the command line (lab/docker-compose.yml, --set): HOME_NET
# is the protected network, EXTERNAL_NET is any. Without that most ET rules never fire.
suricata-version: "7.0"

vars:
  address-groups:
    HOME_NET: "[10.10.2.0/24]"
    EXTERNAL_NET: "any"
    HTTP_SERVERS: "$HOME_NET"
    SMTP_SERVERS: "$HOME_NET"
    SQL_SERVERS: "$HOME_NET"
    DNS_SERVERS: "$HOME_NET"
    TELNET_SERVERS: "$HOME_NET"
    AIM_SERVERS: "$EXTERNAL_NET"
    DC_SERVERS: "$HOME_NET"
    DNP3_SERVER: "$HOME_NET"
    DNP3_CLIENT: "$HOME_NET"
    MODBUS_CLIENT: "$HOME_NET"
    MODBUS_SERVER: "$HOME_NET"
    ENIP_CLIENT: "$HOME_NET"
    ENIP_SERVER: "$HOME_NET"
  port-groups:
    HTTP_PORTS: "80"
    SHELLCODE_PORTS: "!80"
    ORACLE_PORTS: 1521
    SSH_PORTS: 22
    DNP3_PORTS: 20000
    MODBUS_PORTS: 502
    FILE_DATA_PORTS: "[$HTTP_PORTS,110,143]"
    FTP_PORTS: 21
    GENEVE_PORTS: 6081
    VXLAN_PORTS: 4789
    TEREDO_PORTS: 3544

# /eve is the shared volume (lab/docker-compose.yml). Suricata runs as root with only NET_RAW and
# DAC_READ_SEARCH (no privilege drop), and a fresh volume is owned by root, so it can write there.
default-log-dir: /eve/

stats:
  enabled: no

outputs:
  - eve-log:
      enabled: yes
      filetype: regular
      filename: eve.json
      pcap-file: false
      types:
        - alert:
            payload: no
            packet: no
            metadata: no
            http-body: no
            tagged-packets: no

# Capture on the interface given with -i. promisc is off: the sensor routes the lab traffic, so every
# packet is addressed to its own interface, and joining promiscuous mode needs NET_ADMIN, which the
# container does not have (nor does it need it to read the packets).
af-packet:
  - interface: default
    cluster-id: 99
    cluster-type: cluster_flow
    defrag: yes
    promisc: no
    use-mmap: yes
    tpacket-v3: yes

logging:
  default-log-level: notice
  outputs:
    - console:
        enabled: yes

classification-file: /etc/suricata.dist/classification.config
reference-config-file: /etc/suricata.dist/reference.config
