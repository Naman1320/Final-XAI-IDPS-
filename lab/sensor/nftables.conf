# Lab firewall on the sensor: forward only between the two lab subnets, on their own interfaces.
# The management network (lab_mgmt, 10.10.3.0/24, the lab SOC) is never forwarded in either
# direction, whatever the addresses say. The IDPS adds its own block rules in a separate table.
table inet labfw {
  chain forward {
    type filter hook forward priority 0; policy drop;
    iifname "lab_mgmt" drop comment "never forward from the management network"
    oifname "lab_mgmt" drop comment "never forward to the management network"
    ip daddr { 10.10.1.1, 10.10.2.1 } drop comment "never forward to the Docker VM gateways"
    iifname "lab_attack" oifname "lab_victim" ip saddr 10.10.1.0/24 ip daddr 10.10.2.0/24 accept
    iifname "lab_victim" oifname "lab_attack" ip saddr 10.10.2.0/24 ip daddr 10.10.1.0/24 accept
  }
  chain input {
    type filter hook input priority 0; policy accept;
    # The sensor only opens connections to the SOC; nothing on mgmt may start one to it.
    iifname "lab_mgmt" ct state established,related accept
    iifname "lab_mgmt" drop
    iifname != "lab_mgmt" ip daddr 10.10.3.0/24 drop comment "the mgmt address only on mgmt"
  }
}
