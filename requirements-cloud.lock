# Pins for the cloud extra (pip install -e ".[cloud]"), generated from the dev venv:
#   pip freeze | grep -i -E '^(boto3|botocore|jmespath|s3transfer|urllib3|python-dateutil|six)=='
#
# Use it INSTEAD of requirements.lock, not together with it:
#   pip install -c requirements-cloud.lock -e ".[dev,cloud]"
# botocore requires python-dateutil<3, and requirements.lock pins python-dateutil 4.0.0 (the
# sensor image), so "-c requirements.lock -c requirements-cloud.lock" cannot resolve. The
# sensor image does not include boto3; the collector runs from a venv, not from that image.
