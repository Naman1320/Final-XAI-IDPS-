# For developers: `alembic revision --autogenerate --rev-id 0002 -m "what changed"`,
# `alembic upgrade head`. The database is the SOC's: IDPS_SOC_DATABASE_URL (and
# IDPS_SOC_JWT_SECRET, which the settings require) must be set. The SOC itself builds its
# configuration in code (soc/api/migrate.py) and does not read this file.
[alembic]
script_location = soc.api:migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
